name: epc_app
description: "EPC — نادي رواد الاقتصاد | Economics Pioneers Club"
publish_to: 'none'
version: 1.9.0+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.0
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  http: ^1.2.0
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/banner.png
    - assets/images/club_banner.png
    - assets/images/member_card.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
