name: Build EPC App (Web + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href /epc_app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: epc-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: EPC App v1.0.0 — نادي رواد الاقتصاد
          body: |
            تحميل تطبيق نادي رواد الاقتصاد (Android APK).
            حساب القائد التجريبي: 000000 / admin123
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
