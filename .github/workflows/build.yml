name: Build & Deploy EPC App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-epc
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'
  LEADER_REG_B64: ${{ secrets.LEADER_REG_B64 }}
  LEADER_PASS_B64: ${{ secrets.LEADER_PASS_B64 }}
  SYNC_URL: ${{ secrets.SYNC_URL }}
  SYNC_KEY: ${{ secrets.SYNC_KEY }}

jobs:
  # ── 1) نشر خدمة المزامنة على Cloudflare Workers + R2 ────────────────
  sync-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test chat worker
        run: node cloudflare/test/chat_test.mjs

      - name: Ensure R2 bucket exists
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::notice::CLOUDFLARE_API_TOKEN غير مضبوط — تم تخطي الخدمة"; exit 0; fi
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"name":"epc-club-data"}' || true

      - name: Deploy sync Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SYNC_KEY_VALUE: ${{ secrets.SYNC_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CHAT_LEADER_REG: ${{ secrets.LEADER_REG_B64 }}
          CHAT_LEADER_PASS: ${{ secrets.LEADER_PASS_B64 }}
          CHAT_MEDIA_SECRET: ${{ secrets.CHAT_MEDIA_SECRET }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "::notice::تم تخطي نشر Worker"; exit 0; fi
          cd cloudflare
          python3 - "$SYNC_KEY_VALUE" <<'PY'
          import json, sys, os
          meta = {
            "main_module": "worker.js",
            "compatibility_date": "2026-01-01",
            "bindings": [
              {"type": "r2_bucket", "name": "EPC_BUCKET", "bucket_name": "epc-club-data"},
              {"type": "secret_text", "name": "SYNC_KEY", "text": sys.argv[1]},
            ],
          }
          for name in ("CHAT_LEADER_REG", "CHAT_LEADER_PASS", "CHAT_MEDIA_SECRET"):
            value = os.environ.get(name, "")
            if value: meta["bindings"].append({"type": "secret_text", "name": name, "text": value})
          firebase = os.environ.get("FIREBASE_SERVICE_ACCOUNT", "")
          if firebase:
            meta["bindings"].append({"type": "secret_text", "name": "FIREBASE_SERVICE_ACCOUNT", "text": firebase})
          open("metadata.json", "w").write(json.dumps(meta))
          PY
          curl -sS -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/epc-sync" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -F "metadata=@metadata.json;type=application/json" \
            -F "worker.js=@worker.js;type=application/javascript+module" \
            -o /tmp/worker-out.json -w "worker deploy: %{http_code}\n"
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/scripts/epc-sync/subdomain" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            -d '{"enabled":true}' -o /dev/null -w "subdomain: %{http_code}\n"
          head -c 300 /tmp/worker-out.json

      - name: Verify R2 conditional writes
        env:
          TEST_URL: ${{ secrets.SYNC_URL }}
          TEST_KEY: ${{ secrets.SYNC_KEY }}
        run: |
          set -e
          curl --fail-with-body -sS -X POST "${TEST_URL%/}/sync-check" -H "x-sync-key: $TEST_KEY" \
            | python3 -c 'import json,sys; assert json.load(sys.stdin).get("ok"); print("R2 conditional writes verified")'

      - name: Verify deployed chat account access
        env:
          TEST_URL: ${{ secrets.SYNC_URL }}
          TEST_KEY: ${{ secrets.SYNC_KEY }}
          TEST_REG_B64: ${{ secrets.LEADER_REG_B64 }}
          TEST_PASS_B64: ${{ secrets.LEADER_PASS_B64 }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          cred = {"reg": base64.b64decode(os.environ['TEST_REG_B64']).decode(), "password": base64.b64decode(os.environ['TEST_PASS_B64']).decode()}
          headers = {"User-Agent": "Mozilla/5.0 EPC-Chat", "x-sync-key": os.environ['TEST_KEY'], "x-chat-auth": base64.b64encode(json.dumps(cred).encode()).decode()}
          req = urllib.request.Request(os.environ['TEST_URL'].rstrip('/') + '/chat/messages', headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
            data = json.load(response)
            assert response.status == 200 and isinstance(data.get('messages'), list)
          print('Deployed chat access verified')
          PY

      - name: Validate push delivery configuration without sending
        env:
          SYNC_KEY_VALUE: ${{ secrets.SYNC_KEY }}
          SYNC_URL_VALUE: ${{ secrets.SYNC_URL }}
        run: |
          set -e
          curl --fail-with-body -sS -X POST "${SYNC_URL_VALUE%/}/notify" \
            -H "x-sync-key: $SYNC_KEY_VALUE" -H 'content-type: application/json' \
            --data '{"id":"ci-check","title":"validation","place":"","at":"2030-01-01T12:00:00Z","operation":"create","validate_only":true}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("validated"); print("Push validation passed")'

  # ── 2) تطبيق الويب: GitHub Pages + Cloudflare Pages ──────────────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Build for GitHub Pages
        run: |
          flutter build web --release --base-href /epc_app/ \
            --dart-define=LEADER_REG_B64="$LEADER_REG_B64" \
            --dart-define=LEADER_PASS_B64="$LEADER_PASS_B64" \
            --dart-define=SYNC_URL="$SYNC_URL" \
            --dart-define=SYNC_KEY="$SYNC_KEY"

      - name: Keep Pages build
        run: cp -r build/web /tmp/web-github-pages

      - name: Build for Cloudflare Pages
        run: |
          flutter build web --release --base-href / \
            --dart-define=LEADER_REG_B64="$LEADER_REG_B64" \
            --dart-define=LEADER_PASS_B64="$LEADER_PASS_B64" \
            --dart-define=SYNC_URL="$SYNC_URL" \
            --dart-define=SYNC_KEY="$SYNC_KEY"

      - name: Keep Cloudflare build
        run: cp -r build/web /tmp/web-cloudflare-pages

      # ── GitHub Pages ──
      - uses: actions/configure-pages@v5

      - name: Restore GitHub Pages build
        run: |
          rm -rf build/web
          cp -r /tmp/web-github-pages build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # ── Cloudflare Pages ──
      - name: Check Cloudflare credentials
        if: always()
        id: cf
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare::أضف CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID للنشر على Cloudflare."
          fi

      - name: Deploy to Cloudflare Pages
        if: always() && steps.cf.outputs.ready == 'true'
        run: |
          npx --yes wrangler@4 pages deploy /tmp/web-cloudflare-pages --project-name=epc-club --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # ── 3) تطبيق الأندرويد: APK موقّع بمفتاح إصدار حقيقي ─────────────────
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Restore release keystore
        run: |
          mkdir -p android/keys
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/keys/epc-release.jks
          printf 'storeFile=keys/epc-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" > android/key.properties
          sed 's/storePassword=.*/storePassword=***/' android/key.properties

      - name: Dependencies
        run: flutter pub get

      - name: Test activity synchronization
        run: flutter test test/activities_test.dart test/activity_empty_ui_test.dart test/chat_member_profile_test.dart

      - name: Build signed APK (universal)
        run: |
          flutter build apk --release \
            --dart-define=LEADER_REG_B64="$LEADER_REG_B64" \
            --dart-define=LEADER_PASS_B64="$LEADER_PASS_B64" \
            --dart-define=SYNC_URL="$SYNC_URL" \
            --dart-define=SYNC_KEY="$SYNC_KEY"

      - name: Build signed APK (arm64 — حجم أصغر)
        run: |
          flutter build apk --release --target-platform android-arm64 --split-per-abi \
            --dart-define=LEADER_REG_B64="$LEADER_REG_B64" \
            --dart-define=LEADER_PASS_B64="$LEADER_PASS_B64" \
            --dart-define=SYNC_URL="$SYNC_URL" \
            --dart-define=SYNC_KEY="$SYNC_KEY"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/epc-arm64.apk || true

      - name: Build Play Store bundle (AAB)
        run: |
          flutter build appbundle --release \
            --dart-define=LEADER_REG_B64="$LEADER_REG_B64" \
            --dart-define=LEADER_PASS_B64="$LEADER_PASS_B64" \
            --dart-define=SYNC_URL="$SYNC_URL" \
            --dart-define=SYNC_KEY="$SYNC_KEY"

      - name: Verify signing
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          BT=$(ls -d $ANDROID_SDK_ROOT/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -n "$BT" ] && [ -x "$BT/apksigner" ]; then
            "$BT/apksigner" verify --verbose --print-certs "$APK" | head -12
          fi

      - name: Package artifacts (أسماء واضحة + بصمة)
        run: |
          set -e
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VER=$VER" >> "$GITHUB_ENV"
          rm -rf out && mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk      "out/EPC-Club-${VER}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/EPC-Club-${VER}-arm64.apk"
          cp build/app/outputs/bundle/release/app-release.aab   "out/EPC-Club-${VER}-playstore.aab"
          cp "out/EPC-Club-${VER}-arm64.apk" build/epc-arm64.apk
          cp "out/EPC-Club-${VER}-universal.apk" build/epc-universal.apk
          ( cd out && sha256sum * > SHA256.txt )
          ls -lh out && cat out/SHA256.txt

      - name: Build alternate package for existing 1.8.1 installations
        env:
          ORG_GRADLE_PROJECT_epcApplicationId: dz.epc.epc_app.alt
        run: |
          set -e
          flutter build apk --release \
            --dart-define=LEADER_REG_B64="$LEADER_REG_B64" \
            --dart-define=LEADER_PASS_B64="$LEADER_PASS_B64" \
            --dart-define=SYNC_URL="$SYNC_URL" \
            --dart-define=SYNC_KEY="$SYNC_KEY"
          APK="out/EPC-Club-${VER}-compatible.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep "package: name='dz.epc.epc_app.alt'"
          ( cd out && sha256sum ./*.apk ./*.aab > SHA256.txt )

      - name: Mirror APK to R2 (رابط تنزيل مباشر)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then echo "::notice::تخطي الرفع إلى R2"; exit 0; fi
          for pair in "out/EPC-Club-${VER}-arm64.apk:epc-arm64.apk" "out/EPC-Club-${VER}-universal.apk:epc-universal.apk"; do
            SRC="${pair%%:*}"; DST="${pair##*:}"
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/r2/buckets/epc-club-data/objects/$DST" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$SRC" -o /tmp/r2-$DST.json -w "$DST upload: %{http_code}\n"
            head -c 200 /tmp/r2-$DST.json; echo
          done

      - uses: actions/upload-artifact@v4
        with:
          name: epc-android
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.14.1
          name: EPC App v1.14.1 — نادي رواد الاقتصاد
          body: |
            ## نادي رواد الاقتصاد — Economics Pioneers Club
            ### الإصدار 1.14.1 — نسخة متوافقة

            تصميم موحد بالذهبي والأبيض، وبطاقات عضوية قابلة للقلب في الملفات العامة للأعضاء.
            لا تعرض البطاقة العامة بيانات الاتصال أو رقم التسجيل أو رمز التحقق الخاص.

            - [تنزيل النسخة المتوافقة مع الإصدار البديل 1.8.1](https://github.com/aitecomp/epc_app/releases/download/v1.14.1/EPC-Club-1.14.1-compatible.apk)
            - [تنزيل APK الشامل](https://github.com/aitecomp/epc_app/releases/download/v1.14.1/EPC-Club-1.14.1-universal.apk)
            - [تطبيق الويب](https://epc-club.pages.dev)

          files: |
            out/*.apk
            out/SHA256.txt
          fail_on_unmatched_files: true
